name: Validate application

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/mysql-clerk-migration-foundation
      - feat/authjs-migration

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://chemistry_app:placeholder@127.0.0.1:3306/project_chemistry
      SHADOW_DATABASE_URL: mysql://chemistry_app:placeholder@127.0.0.1:3306/project_chemistry_shadow
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-placeholder-secret-for-build-validation-only
      GOOGLE_CLIENT_ID: test-google-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies and refresh lockfile if needed
        run: npm install
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
